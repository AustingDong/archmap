<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-base:    #080c14;
        --bg-surface: #0d1421;
        --bg-raised:  #111827;
        --bg-hover:   #1a2235;
        --bg-card:    #141e2e;
        --border:     #1e2d40;
        --border-bright: #2a3f58;

        --text-primary:   #e8f0fe;
        --text-secondary: #8ba0b8;
        --text-muted:     #4a6070;

        --accent:       #4f7cff;
        --accent-dim:   rgba(79,124,255,0.12);
        --accent-hover: #6b96ff;

        --green:  #22c55e;
        --yellow: #f59e0b;
        --red:    #ef4444;
        --purple: #a855f7;
        --cyan:   #06b6d4;
        --pink:   #ec4899;

        --radius-sm: 6px;
        --radius:    10px;
        --radius-lg: 16px;

        --shadow: 0 4px 24px rgba(0,0,0,0.4);
        --glow:   0 0 20px rgba(79,124,255,0.15);
      }

      html, body { height: 100%; }

      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #root { height: 100vh; display: flex; flex-direction: column; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a5070; }

      input, select, textarea, button { font-family: inherit; }

      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 14px; border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 500; cursor: pointer;
        border: none; transition: all 0.15s ease; white-space: nowrap;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,124,255,0.4); }
      .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
      .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-bright); }
      .btn-danger { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
      .btn-danger:hover { background: rgba(239,68,68,0.2); }
      .btn-sm { padding: 4px 10px; font-size: 12px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

      input[type="text"], input[type="search"], input[type="email"], select, textarea {
        background: var(--bg-raised); color: var(--text-primary);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        padding: 7px 12px; font-size: 13px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        width: 100%;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
      }
      select option { background: var(--bg-raised); }
      textarea { resize: vertical; min-height: 80px; }

      .badge {
        display: inline-flex; align-items: center;
        padding: 2px 9px; border-radius: 20px;
        font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(79,124,255,0); } 50% { box-shadow: 0 0 0 4px rgba(79,124,255,0.2); } }

      .fade-in { animation: fadeIn 0.2s ease; }

      .spinner {
        width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;
        border: 2px solid var(--border-bright); border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      .spinner-lg { width: 28px; height: 28px; border-width: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
